[project]
name = "crm-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.28.1",
    "mcp>=1.24,<2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crm_gateway"
